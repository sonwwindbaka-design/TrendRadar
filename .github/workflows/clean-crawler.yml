name: Clean Workflow Runs

# 🧹 手动清理 Actions 运行记录。
# 🧹 Manually clean GitHub Actions workflow run history.
#
# 📌 操作方法 / How to use:
#   1. 点击 "Run workflow" 按钮 / Click "Run workflow" button
#   2. 仅在运行记录太多、界面难以查看时手动运行 / Run only when history is too noisy

on:
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"
