name: Get Hot News

on:
  # Local launchd now owns the recurring 08:33 and 20:33 runs.
  # Keep manual dispatch as a GitHub Actions fallback.
  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Deduplicate scheduled window
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_JSON_FILE="${RUNNER_TEMP}/current-run.json"
          RUNS_JSON_FILE="${RUNNER_TEMP}/scheduled-runs.json"

          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUN_JSON_FILE"
          gh api "repos/${{ github.repository }}/actions/workflows/crawler.yml/runs?event=schedule&branch=${{ github.ref_name }}&per_page=50" > "$RUNS_JSON_FILE"

          export RUN_JSON_FILE RUNS_JSON_FILE CURRENT_RUN_ID="${{ github.run_id }}"
          python3 <<'PY'
          import json
          import os
          from datetime import datetime

          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          with open(os.environ["RUN_JSON_FILE"], encoding="utf-8") as fh:
              current_run = json.load(fh)
          with open(os.environ["RUNS_JSON_FILE"], encoding="utf-8") as fh:
              runs = json.load(fh).get("workflow_runs", [])

          current_created = datetime.fromisoformat(current_run["created_at"].replace("Z", "+00:00"))

          duplicate = False
          for run in runs:
              if run.get("id") == current_run_id:
                  continue
              if run.get("event") != "schedule" or run.get("conclusion") != "success":
                  continue

              run_created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              same_window = (
                  run_created.date() == current_created.date()
                  and run_created.hour == current_created.hour
              )
              if same_window:
                  duplicate = True
                  print(
                      "Duplicate scheduled window already succeeded: "
                      f"run #{run.get('run_number')} at {run.get('created_at')}"
                  )
                  break

          if duplicate:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("SKIP_RUN=true\n")
              print("Skipping this backup run to avoid duplicate push.")
          else:
              print("No successful run found in this scheduled window; continuing.")
          PY

      - name: Restore crawler history
        if: success() && env.SKIP_RUN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: output
          key: trendradar-output-${{ github.run_id }}
          restore-keys: |
            trendradar-output-

      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      # - name: Random Delay (Traffic Control)
      #   if: success()
      #   run: |
      #     echo "🎲 Traffic Control: Generating random delay..."
      #     DELAY=$(( ( RANDOM % 300 )  + 1 ))
      #     echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
      #     sleep ${DELAY}s
      #     echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success() && env.SKIP_RUN != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success() && env.SKIP_RUN != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success() && env.SKIP_RUN != 'true'
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success() && env.SKIP_RUN != 'true'
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Run crawler
        if: success() && env.SKIP_RUN != 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Save crawler history
        if: success() && env.SKIP_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: output
          key: trendradar-output-${{ github.run_id }}
